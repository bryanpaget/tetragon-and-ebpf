name: Build Slides and Reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Install Chromium for Marp PDF export
        run: sudo apt-get update && sudo apt-get install -y chromium --no-install-recommends

      - name: Install Typst
        run: |
          wget https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf typst-x86_64-unknown-linux-musl.tar.xz
          mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          chmod +x /usr/local/bin/typst

      - name: Build all PDFs via Makefile
        run: |
          make pdf reports

      - name: Verify PDFs exist
        run: |
          for f in tetragon-ebpf-presentation-en.pdf tetragon-ebpf-presentation-fr.pdf tetragon-ebpf-report-en.pdf tetragon-ebpf-report-fr.pdf; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(du -h "$f" | cut -f1))"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tetragon-ebpf-pdfs
          path: |
            tetragon-ebpf-presentation-en.pdf
            tetragon-ebpf-presentation-fr.pdf
            tetragon-ebpf-report-en.pdf
            tetragon-ebpf-report-fr.pdf
          retention-days: 14
