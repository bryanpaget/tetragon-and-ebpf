name: Build Marp Presentations

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    name: Build PDFs
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Install Chromium for Marp PDF export
        run: apt-get update && apt-get install -y chromium --no-install-recommends

      - name: Setup temporary directory
        run: mkdir -p temp && cp -r img temp/

      - name: Combine header and English content
        run: cat config/header.md content/slides-en.md > temp/slides-en-combined.md

      - name: Combine header and French content
        run: cat config/header.md content/slides-fr.md > temp/slides-fr-combined.md

      - name: Build English PDF
        run: marp --allow-local-files --pdf-outlines --pdf --output tetragon-ebpf-presentation-en.pdf temp/slides-en-combined.md

      - name: Build French PDF
        run: marp --allow-local-files --pdf-outlines --pdf --output tetragon-ebpf-presentation-fr.pdf temp/slides-fr-combined.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tetragon-ebpf-presentation-en.pdf
            tetragon-ebpf-presentation-fr.pdf
          generate_release_notes: true
          draft: false
